# Description : recherche locale d'IOC dans les journaux, fichiers, processus
#               et connexions reseau d'un serveur Linux.

# Format : actif;categorie;type;valeur_ou_expression;commentaire
# actif : 1 = recherche active, 0 = desactivee
# Les expressions sont traitees comme des expressions regulieres etendues par grep -E.
# Les valeurs proviennent de la synthese ELLIO PHP2Shell preparee precedemment.

# ================== PHP2Shell - traces HTTP ==================
1;LOG;HTTP_USER_AGENT;php2shell-scan/109618;User-Agent observe
1;LOG;HTTP_USER_AGENT;php2shell-109618;User-Agent observe
1;LOG;HTTP_USER_AGENT;php2shell-verify/1\.0;User-Agent observe
1;LOG;MULTIPART_BOUNDARY;----p2s;Prefixe de boundary multipart observe
1;LOG;MULTIPART_FIELD;PHP_SESSION_UPLOAD_PROGRESS;Signal a correler - peut etre legitime
1;LOG;POC_MARKER;JACKALPOC;Marqueur du POC public
1;LOG;COMMAND;uname -a; id; echo JACKALPOC;Commande par defaut du POC public
1;LOG;PAYLOAD;15\.235\.206\.16:8443;Adresse observee dans un appel curl
1;LOG;HTTP_HEADER;Accept: Accept:\*/\*;Entete dupliquee de la charge de second niveau observee

# ================== PHP2Shell - reseau ==================
1;IP;STAGING;92.118.112.100;Serveur ayant servi /nfs
1;IP;PAYLOAD_CALL;15.235.206.16;Adresse appelee sur le port 8443
1;IP;C2;134.199.154.64;Adresse de commande et controle observee
1;IP;UPDATE;117.55.202.115;Hote de second niveau et mise a jour
1;IP;DELIVERY;45.198.224.169;Infrastructure ayant livre le chargeur observe
0;IP;DECOY;134.154.64.199;NE PAS traiter comme C2 - adresse publiee mais non utilisee par la charge
1;DOMAIN;C2;thunder\.godofthunder\.st;Domaine C2 observe
1;DOMAIN;UPDATE;hackattackkaboom\.botlesscucks\.st;Domaine de mise a jour observe

# ================== PHP2Shell - fichiers ==================
1;FILE;PATH;/tmp/nfs;Fichier de second niveau observe
1;FILE;PATH;/dev/shm/\.cache\.so;Fichier ephemere observe

# ================== PHP2Shell - empreintes ==================
1;HASH;SHA256;0c5486f06620e26e316f4b33f318b0d646d5e1133789331aa2fed012360d1486;Binaire ELF x86-64 observe
1;HASH;MD5;b61a098fc62a2c2696e196dca78da71a;Binaire ELF x86-64 observe

# ================== PHP2Shell - processus ==================
1;PROCESS;NAME;telnetd;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;udhcpc;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;upnpd;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;watchdog;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;syslogd;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;klogd;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;uhttpd;Nom possible adopte par la charge - peut etre legitime
1;PROCESS;NAME;uchttpd;Nom possible adopte par la charge - peut etre legitime


